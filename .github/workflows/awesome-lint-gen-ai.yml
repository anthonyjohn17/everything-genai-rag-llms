name: Awesome lint (generative AI list)

on:
  pull_request:
    paths:
      - "everything-gen-ai/README.md"
  push:
    branches: [main]
    paths:
      - "everything-gen-ai/README.md"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: everything-gen-ai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Run awesome-lint
        run: npx --yes awesome-lint .
